services:
  web:
    build: .
    container_name: phpstan_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: phpstan_demo
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: phpstan_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: phpstan_demo
    ports:
      # Porta 3307 no seu PC para o HeidiSQL (evita conflito com um MySQL local na 3306)
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
